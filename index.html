<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OHOUSE — MADE FOR FRIENDS.</title>
<meta name="description" content="OHOUSE. MADE FOR FRIENDS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
</head>
<body class="home">

<header>
  <a class="brand" href="index.html">OHOUSE</a>
  <nav>
    <a href="shop.html">SHOP</a>
    <a href="#cart" id="cart-link">CART (0)</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<!-- home: the 4-frame boil animation is scrubbed by scrolling; the page itself never moves.
     Past the last frame, we auto-advance to the shop. -->
<canvas id="frame-canvas"></canvas>

<!-- hover hotspots over the artwork (positioned by JS to track the drawn square) -->
<div class="hotspot" id="hs-door" title=""><span class="sign">Shop</span></div>
<div class="hotspot" id="hs-person"><span class="sign">Contact</span></div>

<div id="home-title">
  <h1>OHOUSE</h1>
  <div class="slogan">MADE FOR FRIENDS.</div>
  <div class="hint">( scroll )</div>
</div>

<script src="store.js"></script>
<script>
/* ============ locked scroll scrub over the 4-frame boil ============ */
const FRAMES = ['frames/outside-1.webp', 'frames/outside-2.webp', 'frames/outside-3.webp', 'frames/outside-4.webp'];
const STEP = 260;                       /* scroll px per frame */
const ADVANCE_AT = FRAMES.length * STEP + 240; /* past the last frame -> go to shop */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const canvas = document.getElementById('frame-canvas');
const ctx = canvas.getContext('2d');
const DPR = Math.min(2, devicePixelRatio || 1);
const imgs = new Array(FRAMES.length).fill(null);
let acc = 0, lastDrawn = -1, advancing = false;

function sizeCanvas() { canvas.width = innerWidth * DPR; canvas.height = innerHeight * DPR; lastDrawn = -1; draw(); positionHotspots(); }

function frameIndex() { return Math.min(FRAMES.length - 1, Math.floor(acc / STEP)); }

function draw() {
  const i = REDUCED ? 0 : frameIndex();
  if (i === lastDrawn) return;
  const im = imgs[i] || imgs.find(Boolean);
  if (!im) return;
  lastDrawn = i;
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#efefeb'; ctx.fillRect(0, 0, W, H);
  const s = Math.max(W / im.width, H / im.height); /* cover: always full width */
  const dw = im.width * s, dh = im.height * s;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);
}

function bump(delta) {
  if (REDUCED || advancing) return;
  acc = Math.max(0, Math.min(ADVANCE_AT + 10, acc + delta));
  draw();
  if (acc >= ADVANCE_AT) {
    advancing = true;
    location.href = 'shop.html';
  }
}

addEventListener('wheel', e => bump(e.deltaY), { passive: true });
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') bump(STEP);
  if (e.key === 'ArrowUp' || e.key === 'PageUp') bump(-STEP);
});
let touchY = null;
addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', e => {
  if (touchY === null) return;
  bump((touchY - e.touches[0].clientY) * 2);
  touchY = e.touches[0].clientY;
}, { passive: true });

/* ---------- hotspots track the cover-rendered square artwork ---------- */
/* regions in artwork coordinates (fraction of the square) */
const HOTSPOTS = [
  { el: 'hs-door',   x: 0.17, y: 0.38, w: 0.26, h: 0.50, href: 'shop.html' },
  { el: 'hs-person', x: 0.42, y: 0.60, w: 0.21, h: 0.30, href: 'contact.html' }
];
function positionHotspots() {
  const side = Math.max(innerWidth, innerHeight);
  const ox = (innerWidth - side) / 2, oy = (innerHeight - side) / 2;
  HOTSPOTS.forEach(h => {
    const el = document.getElementById(h.el);
    el.style.left = (ox + h.x * side) + 'px';
    el.style.top = (oy + h.y * side) + 'px';
    el.style.width = (h.w * side) + 'px';
    el.style.height = (h.h * side) + 'px';
  });
}
HOTSPOTS.forEach(h => document.getElementById(h.el).addEventListener('click', () => location.href = h.href));
addEventListener('resize', sizeCanvas);

/* load frames then start */
FRAMES.forEach((src, i) => {
  const im = new Image();
  im.onload = () => { imgs[i] = im; if (i === 0 || lastDrawn === -1) { lastDrawn = -1; draw(); } };
  im.src = src;
});
sizeCanvas();
</script>
</body>
</html>
