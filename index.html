<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OHOUSE — MADE FOR FRIENDS.</title>
<meta name="description" content="OHOUSE. MADE FOR FRIENDS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
<link rel="preload" as="video" href="assets/dooropen.mp4" type="video/mp4">
</head>
<body class="home">

<header>
  <a class="brand" href="index.html">OHOUSE</a>
  <nav>
    <a href="shop.html">SHOP</a>
    <a href="#cart" id="cart-link">CART (0)</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<!-- resting state: the station scene loops forever; scrolling (or the door
     hotspot / SHOP link) plays the door-open transition, then the shop -->
<video id="rest-video" class="bg-cover" src="assets/station-loop.mp4" autoplay muted loop playsinline preload="auto"></video>

<!-- hover hotspots over the artwork (positioned by JS to track the drawn square);
     labels are cursor-following tooltips -->
<div class="hotspot" id="hs-door"><span class="sign">Shop</span></div>
<div class="hotspot" id="hs-person"><span class="sign">Contact</span></div>

<div id="home-title">
  <h1>OHOUSE</h1>
  <div class="slogan">MADE FOR FRIENDS.</div>
  <div class="hint">( scroll )</div>
</div>

<script src="store.js"></script>
<script>
const restV = document.getElementById('rest-video');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* keep the resting loop alive (autoplay can be blocked) */
function kickRest() { if (!REDUCED && restV.paused && !transitioning) restV.play().catch(() => {}); }
['click', 'touchstart', 'keydown', 'mousemove'].forEach(ev => addEventListener(ev, kickRest, { passive: true }));
setInterval(kickRest, 2000);

/* gestures aimed at an open drawer/popup/lock screen must not start the exit */
function overlayOpen() {
  const signup = document.getElementById('signup-overlay');
  return document.body.classList.contains('drawer-open') ||
         document.body.classList.contains('locked') ||
         (signup && signup.classList.contains('open'));
}
function exitToShop() { if (!overlayOpen()) transitionTo('shop.html'); }

addEventListener('wheel', e => { if (e.deltaY > 0) exitToShop(); }, { passive: true });
addEventListener('keydown', e => {
  if (overlayOpen() || (e.target.closest && e.target.closest('input, textarea'))) return;
  if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') exitToShop();
});
let touchY = null;
addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', e => {
  if (touchY !== null && touchY - e.touches[0].clientY > 24) exitToShop(); /* swipe up = scroll down */
}, { passive: true });

/* ---------- hotspots track the cover-rendered square artwork ---------- */
const HOTSPOTS = [
  { el: 'hs-door',   x: 0.18, y: 0.38, w: 0.25, h: 0.48, href: 'shop.html' },
  { el: 'hs-person', x: 0.46, y: 0.60, w: 0.38, h: 0.26, href: 'contact.html' }
];
function positionHotspots() {
  /* matches .bg-cover's object-position: center 70% (see store.css) */
  const side = Math.max(innerWidth, innerHeight);
  const ox = (innerWidth - side) / 2, oy = (innerHeight - side) * 0.7;
  HOTSPOTS.forEach(h => {
    const el = document.getElementById(h.el);
    el.style.left = (ox + h.x * side) + 'px';
    el.style.top = (oy + h.y * side) + 'px';
    el.style.width = (h.w * side) + 'px';
    el.style.height = (h.h * side) + 'px';
  });
}
HOTSPOTS.forEach(h => {
  const el = document.getElementById(h.el);
  const sign = el.querySelector('.sign');
  el.addEventListener('click', () => { if (!overlayOpen()) transitionTo(h.href); });
  /* tooltip follows the cursor, offset to the bottom-right */
  el.addEventListener('mousemove', e => {
    sign.style.left = (e.clientX + 14) + 'px';
    sign.style.top = (e.clientY + 20) + 'px';
  });
});
addEventListener('resize', positionHotspots);
positionHotspots();
</script>
</body>
</html>
