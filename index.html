<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OHOUSE — MADE FOR FRIENDS.</title>
<meta name="description" content="OHOUSE. MADE FOR FRIENDS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
<style>
/* home background stack: resting loop + one-shot exit clip */
#rest-video, #play-video {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  object-fit: cover; z-index: -2;
}
#play-video { z-index: -1; visibility: hidden; }
#play-video.active { visibility: visible; }
</style>
</head>
<body class="home">

<header>
  <a class="brand" href="index.html">OHOUSE</a>
  <nav>
    <a href="shop.html">SHOP</a>
    <a href="#cart" id="cart-link">CART (0)</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<!-- resting state: mainpagestatic loops forever; on first scroll, outside.mp4
     plays through once (normal playback, uninterruptible) then we go to the shop -->
<video id="rest-video" src="assets/mainpage-loop.mp4" autoplay muted loop playsinline preload="auto"></video>
<video id="play-video" src="assets/outside-loop.mp4" muted playsinline preload="auto"></video>

<!-- hover hotspots over the artwork (positioned by JS to track the drawn square);
     labels are cursor-following tooltips -->
<div class="hotspot" id="hs-door"><span class="sign">Shop</span></div>
<div class="hotspot" id="hs-person"><span class="sign">Contact</span></div>

<div id="home-title">
  <h1>OHOUSE</h1>
  <div class="slogan">MADE FOR FRIENDS.</div>
  <div class="hint">( scroll )</div>
</div>

<script src="store.js"></script>
<script>
const restV = document.getElementById('rest-video');
const playV = document.getElementById('play-video');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* keep the resting loop alive (autoplay can be blocked) */
function kickRest() { if (!REDUCED && restV.paused && !triggered) restV.play().catch(() => {}); }
['click', 'touchstart', 'keydown', 'mousemove'].forEach(ev => addEventListener(ev, kickRest, { passive: true }));
setInterval(kickRest, 2000);

/* ---------- scroll → play outside.mp4 once → shop ---------- */
let triggered = false, navigated = false;
function goShop() { if (navigated) return; navigated = true; location.href = 'shop.html'; }
function trigger() {
  if (triggered || REDUCED) { if (REDUCED) goShop(); return; }
  triggered = true;
  playV.classList.add('active');
  restV.pause();
  playV.currentTime = 0;
  playV.addEventListener('ended', goShop, { once: true });
  playV.play().catch(() => { /* if playback is blocked, don't strand the user */ setTimeout(goShop, 1200); });
  /* safety net: navigate even if 'ended' never fires */
  const dur = (isFinite(playV.duration) && playV.duration) || 1;
  setTimeout(goShop, dur * 1000 + 1600);
}

addEventListener('wheel', e => { if (e.deltaY > 0) trigger(); }, { passive: true });
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') trigger();
});
let touchY = null;
addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', e => {
  if (touchY !== null && touchY - e.touches[0].clientY > 24) trigger(); /* swipe up = scroll down */
}, { passive: true });

/* ---------- hotspots track the cover-rendered square artwork ---------- */
const HOTSPOTS = [
  { el: 'hs-door',   x: 0.17, y: 0.38, w: 0.26, h: 0.50, href: 'shop.html' },
  { el: 'hs-person', x: 0.42, y: 0.60, w: 0.21, h: 0.30, href: 'contact.html' }
];
function positionHotspots() {
  const side = Math.max(innerWidth, innerHeight);
  const ox = (innerWidth - side) / 2, oy = (innerHeight - side) / 2;
  HOTSPOTS.forEach(h => {
    const el = document.getElementById(h.el);
    el.style.left = (ox + h.x * side) + 'px';
    el.style.top = (oy + h.y * side) + 'px';
    el.style.width = (h.w * side) + 'px';
    el.style.height = (h.h * side) + 'px';
  });
}
HOTSPOTS.forEach(h => {
  const el = document.getElementById(h.el);
  const sign = el.querySelector('.sign');
  el.addEventListener('click', () => location.href = h.href);
  /* tooltip follows the cursor, offset to the bottom-right */
  el.addEventListener('mousemove', e => {
    sign.style.left = (e.clientX + 14) + 'px';
    sign.style.top = (e.clientY + 20) + 'px';
  });
});
addEventListener('resize', positionHotspots);
positionHotspots();
</script>
</body>
</html>
