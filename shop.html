<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OHOUSE — SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
</head>
<body class="shop">

<!-- the product-list animation is drawn larger than the viewport and anchored
     so the beanie sits dead-center on screen; the live Shopify product image
     is positioned exactly over the drawn beanie (mapping measured from the
     animation frames — see store.css body.shop / #beanie-spot) -->
<video class="bg-cover" src="assets/productlist-loop.mp4" autoplay muted loop playsinline preload="auto"></video>

<header>
  <a class="brand" href="index.html">OHOUSE</a>
  <nav>
    <a href="shop.html">SHOP</a>
    <a href="#cart" id="cart-link">CART (0)</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<!-- populated from the live Shopify catalog by renderProductSpot() -->
<a id="beanie-spot" href="#">
  <span class="spot-label"></span>
  <img class="front" src="" alt="">
  <img class="back" src="" alt="">
</a>

<script src="store.js"></script>
<script>
/* keep the background loop alive (autoplay can be blocked) */
function kickLoop() { const v = document.querySelector('.bg-cover'); if (v && v.paused) v.play().catch(() => {}); }
['click', 'scroll', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, kickLoop, { passive: true }));
setInterval(kickLoop, 2000);
</script>
</body>
</html>
