<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OHOUSE — SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
</head>
<body class="shop">

<!-- the product-list animation is a square scene showing both products drawn
     in place (beanie worn top-left, tee on a hanger at right). The square is
     centered in the viewport at its natural size; each live Shopify product
     image is positioned exactly over its drawn counterpart (mapping measured
     from the animation frames — see store.css body.shop / .product-spot) -->
<video class="bg-cover" src="assets/productlist-2up.mp4" autoplay muted loop playsinline preload="auto"></video>

<header>
  <a class="brand" href="index.html">OHOUSE</a>
  <nav>
    <a href="shop.html">SHOP</a>
    <a href="#cart" id="cart-link">CART (0)</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<!-- Both spots populated from the live Shopify catalog by renderProductSpot().
     --pl/--pt/--pw are the product's square placement as fractions of the
     animation frame (measured from the frames); store.css turns them into
     an exact overlay on the drawn product. -->
<a class="product-spot" id="spot-beanie" href="#" style="--pl:.2206;--pt:.1049;--pw:.3667">
  <span class="spot-label"></span>
  <img class="front" src="" alt="">
  <img class="back" src="" alt="">
</a>
<a class="product-spot" id="spot-tee" href="#" style="--pl:.617;--pt:.290;--pw:.290">
  <span class="spot-label"></span>
  <img class="front" src="" alt="">
  <img class="back" src="" alt="">
</a>

<script src="store.js"></script>
<script>
/* keep the background loop alive (autoplay can be blocked) */
function kickLoop() { const v = document.querySelector('.bg-cover'); if (v && v.paused) v.play().catch(() => {}); }
['click', 'scroll', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, kickLoop, { passive: true }));
setInterval(kickLoop, 2000);
</script>
</body>
</html>
